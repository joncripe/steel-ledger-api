version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: steel-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: steel_ledger
      POSTGRES_PASSWORD: steel_ledger_dev
      POSTGRES_DB: steel_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
